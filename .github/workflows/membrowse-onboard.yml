name: Onboard to MemBrowse

on:
  workflow_dispatch:
    inputs:
      num_commits:
        description: 'Number of commits to process'
        required: true
        default: '100'
        type: string

jobs:
  onboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Onboard iterates through historical commits, so it needs full history
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install toolchain
        run: rustup toolchain install nightly --profile minimal --component rust-src,llvm-tools --target thumbv7em-none-eabihf

      - name: Run MemBrowse Onboard Action
        uses: membrowse/membrowse-action/onboard-action@eaa94ed53b704064706e7187602d5d0b201921b6 # main, includes onboard checkout fix (#193)
        with:
          target_name: nrf52840-example
          num_commits: ${{ github.event.inputs.num_commits }}
          build_script: cd example && cargo +nightly rustc --release -- -C link-arg=-Map=target/thumbv7em-none-eabihf/release/example.map
          elf: example/target/thumbv7em-none-eabihf/release/example
          ld: example/memory.x
          map_file: example/target/thumbv7em-none-eabihf/release/example.map
          binary_search: 'true'
          api_key: ${{ secrets.MEMBROWSE_API_KEY }}
          api_url: ${{ vars.MEMBROWSE_API_URL }}
